function renderJobs(){return pageHeader('Queue / Tracking','Import jobs','Всички job операции, филтри, status и проследимост по оригинално torrent име и source path.',`<button class="btn secondary" data-nav="queue">${icon('transfer')} Physical move queue</button><button class="btn primary" data-action="start" data-id="VM-1042">${icon('play')} Start sample job</button>`)+renderJobsTable()}
function stepState(j,n){if(j.status==='completed')return 'done';if(n<j.step)return 'done';if(n>j.step)return 'upcoming';if(j.status==='review')return 'review';if(j.status==='failed')return 'failed';if(j.status==='paused')return 'paused';if(j.status==='queued')return 'queued';return 'active'}
function stepLabel(state){return {done:'Completed',upcoming:'Waiting',review:'Needs review',failed:'Failed',paused:'Paused',queued:'Queued',active:'In progress'}[state]||'Waiting'}
function stepDescription(n,j){const msg=[`Torrent event registered · hash ${j.torrentHash.slice(0,12)}… (demo)`,`TMDb candidate ${j.tmdb==='?'?'not confirmed':j.tmdb} · ffprobe streams inspected`,j.existing?`Existing version detected · ${j.reco}`:'No exact edition collision · proceed',j.mode==='protected'?'NAS relocation + protected series layout':'Move via qBittorrent, verify checksum and mapping',`BG subtitles: ${j.bgSub}`,`Jellyfin status: ${j.jellyfin}`,`Final torrent state: ${j.seed}`];return msg[n-1]}
function renderStepsStrip(j){return `<div class="steps-strip">${STEP_NAMES.map((s,i)=>{const n=i+1,st=stepState(j,n);return `<button class="step-tile ${st==='active'||st==='review'||st==='failed'?'active':''} ${st==='done'?'done':''}" data-action="step" data-step="${n}"><div class="step-no"><span>STEP 0${n}</span><span>${st==='done'?icon('check',14):st==='failed'?icon('alert',14):'·'}</span></div><div class="step-t">${esc(s)}</div><div class="step-status ${st==='done'?'text-mint':st==='failed'?'text-red':st==='review'?'text-amber':''}">${stepLabel(st)}</div></button>`}).join('')}</div>`}
function renderStepTimeline(j){return `<section class="panel"><div class="panel-head"><div><div class="ph-title">Workflow execution</div><div class="ph-sub">Click any stage to inspect evidence and actions</div></div></div><div class="step-list">${STEP_NAMES.map((name,i)=>{const n=i+1,st=stepState(j,n),open=activeStep===n;return `<div class="step-item ${open?'open':''}"><button class="step-trigger" data-action="step" data-step="${n}"><span class="step-circle ${st==='done'?'success':st==='failed'?'danger':st==='active'||st==='review'?'active':''}">${st==='done'?icon('check',13):st==='failed'?'!':n}</span><span class="step-word"><strong>${esc(name)}</strong><small>${stepLabel(st)} · ${n<j.step?'~ 00:08–00:14':n===j.step?j.startAt:'Not started'}</small></span>${icon('chevron',13)}</button>${open?`<div class="step-expanded"><div class="row-detail">${esc(stepDescription(n,j))}</div><div class="row-detail"><strong>Execution:</strong> ${st==='done'?'Completed in demo state':st==='upcoming'?'Waiting on prior stages':st==='queued'?'Awaiting start':st==='active'?'Simulated worker active':'Operator attention required'}</div><div class="row-detail"><strong>Start/end:</strong> ${n<j.step?'09:02:11 / 09:02:23':n===j.step?'09:02:23 / —':'— / —'}</div>${st==='failed'?`<div class="rule-note danger">${esc(j.error||'Recovery required')}</div>`:''}<details style="margin:12px 0"><summary style="cursor:pointer;color:var(--mint)">Technical details</summary><pre>job=${esc(j.id)}\ntorrentHash=${esc(j.torrentHash)} (DEMO)\nstep=${n}\nstate=${st}\nsource=${esc(j.source)}\ndestination=${esc(j.dest)}\nmode=${esc(j.mode)}</pre></details><div class="actions"><button class="btn small secondary" data-action="step-retry" data-id="${j.id}" ${n!==j.step?'disabled':''}>${icon('reload',12)} Retry</button><button class="btn small secondary" data-action="override" data-id="${j.id}" ${n!==j.step?'disabled':''}>Review / override</button></div></div>`:''}</div>`}).join('')}</div></section>`}
function renderJobDetail(){const j=jobById(currentId)||jobs[0];const actionButtons=`<button class="btn secondary" data-nav="jobs">← All jobs</button><button class="btn secondary" data-action="destination" data-id="${j.id}">${icon('edit')} Destination</button>${j.existing?`<button class="btn secondary" data-action="compare-job" data-id="${j.id}">${icon('compare')} Compare</button>`:''}${j.status==='processing'&&activeSimulationId===j.id?`<button class="btn secondary" data-action="pause" data-id="${j.id}">${icon('pause')} Pause</button>`:j.status==='paused'||j.status==='processing'?`<button class="btn secondary" data-action="resume" data-id="${j.id}">${icon('play')} Resume</button>`:j.status==='failed'?`<button class="btn primary" data-action="recovery" data-id="${j.id}">${icon('reload')} Recover</button>`:j.status==='review'?`<button class="btn primary" data-action="review-job" data-id="${j.id}">${icon('check')} Resolve review</button>`:j.status==='completed'?`<button class="btn secondary" data-action="verify" data-id="${j.id}">${icon('shield')} Verify again</button>`:`<button class="btn primary" data-action="start" data-id="${j.id}">${icon('play')} Run workflow</button>`}`;return pageHeader(`Import job / ${esc(j.id)}`,esc(j.title),`Torrent: ${esc(j.original)} · ${esc(j.created)} · ${esc(j.size)} GB`,actionButtons)+`<div class="chips" style="margin:-3px 0 16px">${statusTag(j.status)}${tag(j.category,'info')}${audioTag(j.bgAudio)}${subtitleTag(j.bgSub)}${seedTag(j.seed)}${tag(j.mode==='protected'?'Protected multi-file':'Direct relocation','purple')}${tag('Simulation only','warn')}</div>${renderStepsStrip(j)}<div class="job-layout">${renderStepTimeline(j)}<section class="panel"><div class="tabs">${[['overview','Overview'],['streams','Files & streams'],['technical','Move & verification'],['activity','Audit history']].map(([key,label])=>`<button class="tab ${jobTab===key?'active':''}" data-action="job-tab" data-value="${key}">${label}</button>`).join('')}</div><div class="detail-inner">${jobTab==='overview'?renderJobOverview(j):jobTab==='streams'?renderJobStreams(j):jobTab==='technical'?renderJobTechnical(j):renderJobAudit(j)}</div></section></div>`}
function renderJobOverview(j){return `<div class="detail-grid"><div class="info-card"><div class="card-title">${icon('film')} Identified media ${tag(j.tmdb==='?'?'Unverified':'Matched',j.tmdb==='?'?'warn':'success')}</div><dl class="kv"><dt>Original title</dt><dd><strong>${esc(j.title)}</strong></dd><dt>TMDb ID</dt><dd class="mono">${esc(j.tmdb)}</dd><dt>Type / category</dt><dd>${esc(j.type)} / ${esc(j.category)}</dd><dt>Year / edition</dt><dd>${esc(j.year)} / ${esc(j.edition)}</dd><dt>Size</dt><dd>${humanGb(j.size)}</dd></dl>${j.tmdb==='?'?`<div class="rule-note warn">Metadata identity requires manual confirmation. ${j.scenario===7?'Two TMDb candidates found.':'Provider mapping varies by category.'}</div><button style="margin-top:10px" class="btn small secondary" data-action="metadata" data-id="${j.id}">Resolve metadata</button>`:''}</div><div class="info-card"><div class="card-title">${icon('film')} Quality assessment</div><dl class="kv"><dt>Video</dt><dd>${esc(j.quality)}</dd><dt>Codec</dt><dd>${esc(j.codec)}</dd><dt>HDR / DV</dt><dd>${esc(j.hdr)}</dd><dt>Bitrate</dt><dd>${esc(j.bitrate)}</dd><dt>BG audio</dt><dd>${audioTag(j.bgAudio)}</dd><dt>BG subtitles</dt><dd>${subtitleTag(j.bgSub)}</dd></dl><div class="rule-note">Quality combines bitrate, codec, HDR, audio, edition and user language preference; size or resolution alone is never decisive.</div></div><div class="info-card full"><div class="card-title">${icon('transfer')} Proposed move & naming <button class="btn small secondary" data-action="destination" data-id="${j.id}">${icon('edit',13)} Change</button></div><div class="pathbox"><div class="path-label">Local download · qB /downloads</div><div class="path">${esc(j.source)}</div></div><div class="flow-arrow">↓</div><div class="pathbox"><div class="path-label">${j.mode==='protected'?'NAS seeding root (torrent-safe)':'NAS library destination (qB setLocation)'}</div><div class="path">${esc(j.mode==='protected'?j.seedTarget||'/library/.seeding/':j.dest)}</div></div>${j.mode==='protected'?`<div class="flow-arrow">↓ Jellyfin-organized representation (additional NAS capacity)</div><div class="pathbox"><div class="path-label">Organized library · multi-file layout</div><div class="path">${esc(j.dest)}</div></div>`:''}<div class="pathbox"><div class="path-label">Proposed filename · Jellyfin compatible</div><div class="path">${esc(j.filename)}</div></div><div class="chips">${tag('qB API-managed mapping','success')}${tag('No transcoding','plain')}${tag('No auto-delete','warn')}${j.mode==='protected'?tag('Extra NAS space required','warn'):tag('No detached copy','info')}</div></div><div class="info-card"><div class="card-title">${icon('compare')} Library comparison</div>${j.existing?`<p style="font-size:12px;margin:0 0 10px">${esc(j.reco)}</p><div class="chips">${tag(j.existing.quality,'info')}${audioTag(j.existing.bgAudio)}${tag(j.existing.seeders+' torrent dependencies',j.existing.seeders?'warn':'plain')}</div><button class="btn small secondary" style="margin-top:13px" data-action="compare-job" data-id="${j.id}">Open detailed comparison ${icon('arrow',13)}</button>`:`<div class="empty-mini">No confirmed same-edition duplicate. Exact provider match and release metadata will be evaluated.</div>`}</div><div class="info-card"><div class="card-title">${icon('link')} Publishing & seeding</div><dl class="kv"><dt>Jellyfin</dt><dd>${esc(j.jellyfin)}</dd><dt>Torrent state</dt><dd>${seedTag(j.seed)}</dd><dt>File integrity</dt><dd>${j.move.verify===100?tag('Verified','success'):tag('Not yet verified','warn')}</dd><dt>Torrent mapping</dt><dd>${j.move.link===100?tag('Reconnected','success'):tag('Awaiting confirmation','warn')}</dd><dt>Local cleanup</dt><dd>${tag('Never before confirmation','plain')}</dd></dl></div></div>`}
function renderJobStreams(j){return `<div class="detail-grid"><div class="info-card full"><div class="card-title">${icon('folder')} Torrent file structure ${tag(j.files.length+' items','info')}</div><div class="file-tree"><div class="tree-dir">📁 ${esc(j.original.slice(0,48))}${j.files.length>1?'/':''}</div>${j.files.map(f=>`<div class="tree-file" style="padding-left:20px">├─ ${esc(f[0])} <span class="subtle">${esc(f[1])}</span></div>`).join('')}</div>${j.mode==='protected'?`<div class="info-strip warn">${icon('alert')} One torrent → multiple episodes. Reorganizing its internal file paths must not break qB's mapping. Library representation may require an independent NAS copy or verified same-filesystem linking strategy. The internal .seeding area must be excluded from Jellyfin scans.</div>`:''}</div><div class="info-card"><div class="card-title">${icon('music')} Audio tracks</div>${j.audio.map((t,i)=>`<div class="stream-row"><div><div class="stream-name">Track ${i+1} · ${esc(t[0])}</div><div class="stream-sub">${esc(t[1])} · ${esc(t[2])}</div></div>${tag(t[3],t[3].includes('Tagged')?'warn':t[3].includes('Verified')?'success':'plain')}</div>`).join('')||'<div class="empty-mini">No audio streams parsed.</div>'}<div class="rule-note warn">Bulgarian language tags are not the same as verified Bulgarian dubbing.</div></div><div class="info-card"><div class="card-title">${icon('subtitles')} Embedded / external subtitles</div>${j.embeddedSub.length?j.embeddedSub.map((t,i)=>`<div class="stream-row"><div><div class="stream-name">Stream ${i+1} · ${esc(t[0])}</div><div class="stream-sub">${esc(t[1])} · ${esc(t[2])}</div></div>${tag('Detected','info')}</div>`).join(''):`<div class="empty-mini">No embedded subtitles identified.</div>`}<div class="stream-row"><div><div class="stream-name">BG subtitle result</div><div class="stream-sub">Provider search / release compatibility</div></div>${subtitleTag(j.bgSub)}</div><button class="btn small secondary" data-action="subtitle-job" data-id="${j.id}">Open subtitle candidates</button></div><div class="info-card full"><div class="card-title">${icon('info')} Inspect source</div><dl class="kv"><dt>Original release</dt><dd class="mono">${esc(j.original)}</dd><dt>Torrent hash (demo)</dt><dd class="mono">${esc(j.torrentHash)}</dd><dt>Content source</dt><dd class="mono">${esc(j.source)}</dd><dt>Size / files</dt><dd>${humanGb(j.size)} / ${j.files.length}</dd><dt>Media integrity</dt><dd>${j.status==='failed'?tag('Checkpoint required','danger'):tag('Sample ffprobe inspected','info')}</dd></dl></div></div>`}
function renderJobTechnical(j){const p=j.move.pct,v=j.move.verify,l=j.move.link;return `<div class="detail-grid"><div class="info-card full"><div class="card-title">${icon('transfer')} Physical relocation ${tag(j.mode==='direct'?'qB-managed setLocation':'Protected multi-file','info')}</div><div class="info-strip">${icon('info')} All byte metrics below are simulated. qB-managed relocation does not guarantee a byte-level API counter. Production UI must label unknown progress instead of fabricating it.</div><div class="metric-row"><span class="metric-label">Physical transfer / copy</span><strong>${humanGb(j.size*p/100)} / ${humanGb(j.size)} · ${fmtPct(p)}</strong></div><div class="bar ${j.status==='failed'?'red':''}"><i style="width:${p}%"></i></div><div class="metric-row"><span class="metric-label">Destination integrity / checkpoint verification</span><strong>${fmtPct(v)}</strong></div><div class="bar blue"><i style="width:${v}%"></i></div><div class="metric-row"><span class="metric-label">qB path mapping & seeding recovery</span><strong>${fmtPct(l)}</strong></div><div class="bar"><i style="width:${l}%"></i></div>${j.mode==='protected'?`<div class="metric-row"><span class="metric-label">Protected Jellyfin representation on NAS (separate)</span><strong>${fmtPct(j.libraryCopy||0)}</strong></div><div class="bar amber"><i style="width:${j.libraryCopy||0}%"></i></div><div class="hint">qB can resume seeding from NAS before this separate library copy completes.</div>`:''}<div class="chips" style="margin-top:16px">${tag(j.phase==='recovery'?'Recovery required':j.phase==='copying'?'Copying':j.phase,'info')}${seedTag(j.seed)}${tag('Source preserved until verified','success')}</div>${j.status==='failed'?`<div class="rule-note danger">${esc(j.error)}</div><button class="btn primary" style="margin-top:12px" data-action="recovery" data-id="${j.id}">Recover checkpoint</button>`:''}</div><div class="info-card"><div class="card-title">${icon('shield')} Preflight checklist</div>${[['Destination mount available',j.status==='failed'?'danger':'success'],['Free space / quota','success'],['Torrent file map captured','success'],['Auto Torrent Management checked','warn'],['No destructive changes scheduled','success'],['Cross-filesystem operation detected','info']].map(([t,st])=>`<div class="stream-row"><div class="stream-name">${esc(t)}</div>${tag(st==='danger'?'Failed':st==='warn'?'Review':st==='info'?'Detected':'Passed',st)}</div>`).join('')}</div><div class="info-card"><div class="card-title">${icon('link')} Seed health verification</div><dl class="kv"><dt>qB save path</dt><dd>${j.move.link===100?tag('NAS confirmed','success'):tag('Pending','warn')}</dd><dt>Torrent content</dt><dd>${j.move.verify===100?tag('Integrity verified','success'):tag('To verify','warn')}</dd><dt>missingFiles</dt><dd>${j.status==='failed'?tag('Unknown until recovery','warn'):j.move.link===100?tag('None','success'):tag('Not checked','plain')}</dd><dt>Actual seeding</dt><dd>${seedTag(j.seed)}</dd><dt>Auto-TMM</dt><dd>${tag('Requires explicit state check','warn')}</dd></dl></div><div class="info-card full"><div class="card-title">${icon('folder')} Current path planning</div><dl class="kv"><dt>Host local</dt><dd class="mono">/mnt/storage/qbt</dd><dt>qB mount</dt><dd class="mono">/downloads</dd><dt>Host NAS</dt><dd class="mono">/mnt/nas/Movies/Library</dd><dt>qB NAS mount</dt><dd class="mono">/library</dd><dt>Proposed target</dt><dd class="mono">${esc(j.mode==='protected'?j.seedTarget:j.dest)}</dd><dt>Copy strategy</dt><dd>${j.mode==='protected'?'qB NAS seeding layout + separate Jellyfin structure (demo)':'qB setLocation + API rename (demo)'}</dd></dl></div></div>`}
function renderJobAudit(j){const initial=[{time:'09:01:18',message:'Completion event received from qBittorrent; idempotency hash registered',kind:'info'},{time:'09:01:24',message:'ffprobe/MediaInfo analysis simulated; original streams unchanged',kind:'info'},{time:'09:01:31',message:'Media provider matching and BG-first policy evaluated',kind:'info'}];return `<div class="card-title">Persistent event history (simulated)</div><div class="timeline">${[...j.audit,...initial].map(a=>`<div class="activity-row"><strong>${esc(a.message)}</strong>${esc(a.time)} · ${esc(a.kind)}</div>`).join('')}</div><div class="info-strip">${icon('shield')} Real implementation: append-only event history, job/torrent hash uniqueness, restart-safe checkpoints and idempotent operations. Wireframe state lasts only for the current browser session.</div>`}
function renderComparison(){let j=jobById(compareId);if(!j||!j.existing)j=jobs.find(x=>x.existing);const o=j.existing;const isDep=o.seeders>0;return pageHeader('Quality / Decisions','Duplicate comparison','Българският дублаж има приоритет, но значително по-високото качество може да оправдае втора версия.',`<select class="select" id="compareSelect">${jobs.filter(x=>x.existing).map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><button class="btn secondary" data-action="open-job" data-id="${j.id}">Job details ${icon('arrow')}</button>`)+`<div class="chips" style="margin-bottom:15px">${tag('Bulgarian-first policy','success')}${tag('No automatic delete','warn')}${tag(j.reviewsResolved?'Decision reviewed':'Human approval required',j.reviewsResolved?'success':'warn')}</div><div class="compare-grid"><section class="panel compare-card"><div class="compare-hero"><div class="poster ${esc(j.poster)}">${esc(j.title)}</div><div style="min-width:0"><div class="eyebrow">Version A · Existing library</div><h3>${esc(j.title)}</h3><p>${esc(j.year)} · TMDb ${esc(j.tmdb)} · ${esc(o.edition)}</p><div class="chips" style="margin-top:9px">${audioTag(o.bgAudio)}${tag('Existing','info')}</div></div></div><div class="compare-rows">${[['Filename',o.filename],['Resolution',o.resolution],['Codec',o.codec],['Video bitrate',o.bitrate],['HDR / DV',o.hdr],['Audio tracks',o.audio],['BG subtitles',o.subs],['Edition',o.edition],['Duration',j.runtime+' (demo)'],['File size',humanGb(o.size)],['Torrent dependencies',o.seeders+' active '+(o.seeders===1?'torrent':'torrents')]].map(([l,v])=>`<div class="compare-row"><span>${l}</span><strong style="text-align:right;max-width:65%;overflow-wrap:anywhere">${esc(v)}</strong></div>`).join('')}</div></section><section class="panel compare-card"><div class="compare-hero"><div class="poster ${esc(j.poster)}">${esc(j.title)}</div><div style="min-width:0"><div class="eyebrow">Version B · New download</div><h3>${esc(j.title)}</h3><p>${esc(j.year)} · TMDb ${esc(j.tmdb)} · ${esc(j.edition)}</p><div class="chips" style="margin-top:9px">${audioTag(j.bgAudio)}${tag('Incoming','purple')}</div></div></div><div class="compare-rows">${[['Filename',j.filename],['Resolution',j.quality.split(' · ')[0]],['Codec',j.codec],['Video bitrate',j.bitrate],['HDR / DV',j.hdr],['Audio tracks',j.audio.map(a=>a[0]+' '+a[1]+' '+a[2]).join('; ')],['BG subtitles',j.bgSub],['Edition',j.edition],['Duration',j.runtime+' (demo)'],['File size',humanGb(j.size)],['Torrent dependencies','1 incoming torrent']].map(([l,v])=>`<div class="compare-row"><span>${l}</span><strong style="text-align:right;max-width:65%;overflow-wrap:anywhere">${esc(v)}</strong></div>`).join('')}</div></section></div><div class="recommend"><div><div class="eyebrow">${icon('shield',14)} Quality engine recommendation</div><strong>${esc(j.reco)}</strong><p>${j.scenario===2?'Version A preserves verified BG dubbing. Version B delivers significant HDR/4K improvement. Preserve both without replacing A.':j.scenario===3?'Both versions have verified BG audio. Version B is visibly stronger on resolution/HDR; keeping A is optional, but old media is not auto-deleted.':'Version A has verified Bulgarian audio and is still seeded by 2 active torrents. Different editions must remain separate and seeding dependencies block quarantine.'}</p></div>${tag(j.scenario===2?'Keep both':j.scenario===3?'Prefer new BG':'Protected / blocked',j.scenario===8?'warn':'success')}</div><div class="info-strip ${isDep?'warn':''}">${icon('alert')} ${isDep?`Version A has ${o.seeders} active torrent ${o.seeders===1?'dependency':'dependencies'}. A quarantine action is blocked until mapping and seeding impact are explicitly resolved.`:'No active seeding dependency is recorded for version A in demo. Quarantine is still recoverable and requires approval.'}</div><div class="panel pad"><div class="card-title">Decision workspace <span class="muted" style="font-weight:400">All decisions are simulated and audited</span></div><div class="actions"><button class="btn secondary" data-action="decision" data-id="${j.id}" data-choice="keepA">Keep version A</button><button class="btn secondary" data-action="decision" data-id="${j.id}" data-choice="keepB">Keep version B</button><button class="btn primary" data-action="decision" data-id="${j.id}" data-choice="both">${icon('check')} Keep both</button><button class="btn red" data-action="decision" data-id="${j.id}" data-choice="quarantine">${icon('shield')} Propose quarantine</button><button class="btn secondary" data-action="decision" data-id="${j.id}" data-choice="review">Manual review</button></div><div class="hint">“Keep A/B” sets the preferred version. It does not delete the other version. Quarantine proposals are reversible and never automatic.</div></div>`}
function queueStage(j){if(j.status==='queued')return 0;if(j.status==='failed')return 2;if(j.step<4)return 0;if(j.move.pct<100)return 2;if(j.move.verify<100)return 3;if(j.move.link<100)return 4;return 5}
function renderQueue(){const queueJobs=jobs.filter(j=>j.step>=4||j.status==='queued'||j.status==='failed');return pageHeader('Transport / Operations','Import / Move queue','Физическото преместване и възстановяването на seeding са отделни, задължително проверявани операции.',`<button class="btn secondary" data-nav="jobs">All import jobs</button><button class="btn primary" data-action="start" data-id="VM-1042">${icon('play')} Simulate move</button>`)+`<div class="split"><div class="panel pad"><div class="card-title">${icon('transfer')} Move engine design ${tag('No live transfers','warn')}</div><p class="muted" style="font-size:11.5px">Same-FS rename е атомарен; cross-filesystem transfer към NAS не е. При qB-managed move източникът на прогрес може да бъде само състояние „moving“, а не гарантирани transferred bytes. Production safety depends on failover tests with the exact installed qBittorrent build; unvalidated moves are blocked.</p><div class="chips">${tag('Preflight','info')}${tag('Copy/Move','info')}${tag('Integrity','info')}${tag('qB mapping','info')}${tag('Seeding','success')}</div></div><div class="panel pad"><div class="card-title">${icon('shield')} Protection gates</div><div class="stream-row"><span>NAS availability & free space</span>${tag('Mandatory','success')}</div><div class="stream-row"><span>Torrent mapping & file paths</span>${tag('Mandatory','success')}</div><div class="stream-row"><span>Cleanup after hash/recheck confirmation</span>${tag('Blocked until safe','warn')}</div></div></div><div class="panel"><div class="panel-head"><div><div class="ph-title">Move execution & recovery</div><div class="ph-sub">Queued · Preparing · Copying · Verifying · Reconnecting · Completed / Failed / Recovery</div></div>${tag(queueJobs.length+' operations','info')}</div>${queueJobs.map(j=>{const stage=queueStage(j),stageNames=['Queued','Preparing','Copying','Verifying','Reconnecting','Completed'];return `<div class="queue-item"><div class="queue-head"><div><div style="font-size:13px;font-weight:750">${esc(j.title)} <span class="tiny mono">${esc(j.id)}</span></div><div class="tiny">${esc(j.mode==='protected'?'Protected multi-file / NAS staging + library':'Direct / qB setLocation + mapping')}</div></div><div class="actions">${statusTag(j.status)}<button class="btn small secondary" data-action="open-job" data-id="${j.id}">Open ${icon('arrow',12)}</button>${j.status==='failed'?`<button class="btn small red" data-action="recovery" data-id="${j.id}">Recover</button>`:j.status==='paused'?`<button class="btn small" data-action="resume" data-id="${j.id}">Resume</button>`:j.status==='queued'?`<button class="btn small" data-action="start" data-id="${j.id}">Start</button>`:j.status==='processing'&&activeSimulationId===j.id?`<button class="btn small" data-action="pause" data-id="${j.id}">Pause</button>`:j.status==='processing'?`<button class="btn small" data-action="resume" data-id="${j.id}">Start simulation</button>`:''}</div></div><div class="queue-stages">${stageNames.slice(0,5).map((nm,i)=>`<div class="q-stage ${j.status==='failed'&&i===2?'error':i<stage?'done':i===stage?'active':''}">0${i+1}<strong>${nm}</strong></div>`).join('')}</div><div class="queue-info"><div><div class="metric-row"><span class="metric-label">NAS physical move</span><strong>${fmtPct(j.move.pct)} <span class="muted" style="font-weight:500">(${humanGb(j.size*j.move.pct/100)} / ${humanGb(j.size)})</span></strong></div><div class="bar ${j.status==='failed'?'red':''}"><i style="width:${j.move.pct}%"></i></div><div class="pathbox" style="margin:9px 0 0"><div class="path-label">Destination</div><div class="path">${esc(j.mode==='protected'?j.seedTarget:j.dest)}</div></div></div><div><div class="metric-row"><span class="metric-label">Verification / seeding</span><span class="metric-value">${fmtPct(j.move.verify)} / ${fmtPct(j.move.link)}</span></div><div class="bar blue"><i style="width:${j.move.verify}%"></i></div>${j.mode==='protected'?`<div class="tiny" style="margin:8px 0">Jellyfin copy: ${fmtPct(j.libraryCopy||0)} · seeding may already be active</div>`:''}<div style="margin-top:9px" class="chips">${seedTag(j.seed)}${tag(j.status==='failed'?'Recovery required':stage===5?'Verified':'Checkpoint pending',j.status==='failed'?'danger':stage===5?'success':'plain')}</div>${j.status==='failed'?`<div class="tiny text-red" style="margin-top:7px">${esc(j.error)}</div>`:''}</div></div></div>`}).join('')}</div>`}
function matchesLibrary(m){if(libraryCategory!=='All'&&m.category!==libraryCategory)return false;if(librarySearch&&!(`${m.title} ${m.tmdb} ${m.category}`.toLowerCase().includes(librarySearch.toLowerCase())))return false;if(libraryAudio==='verified'&&m.audio!=='verified')return false;if(libraryAudio==='needs'&&m.audio==='verified')return false;if(libraryQuality!=='all'&&!m.quality.includes(libraryQuality))return false;return true}
function renderLibraryMaintenance(){const findings=[['lib-11','Wrong category','Concert under Movies → propose Concerts','danger'],['lib-7','Incomplete metadata','Blue Planet II · enrich NFO/artwork','warn'],['lib-5','Multiple versions','The Dark Knight · preserve both until review','info'],['lib-9','Unidentified media','Pink Floyd Pulse · confirm provider identity','warn']];return `<section class="panel" style="margin-top:15px"><div class="panel-head"><div><div class="ph-title">Library Maintenance · review queue</div><div class="ph-sub">Non-destructive inventory analysis and operator-approved proposals</div></div>${tag('4 demo findings','warn')}</div>${findings.map(([id,label,desc,severity])=>{const m=library.find(x=>x.id===id);return `<div class="queue-item" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="min-width:0"><div class="chips" style="margin-bottom:5px">${tag(label,severity)}${m.maintReviewed?tag('Plan reviewed','success'):tag('Pending','plain')}</div><strong style="font-size:11.5px">${esc(m.title)}</strong><div class="tiny">${esc(desc)}</div></div><button class="btn small secondary" data-action="maintenance" data-id="${id}">${m.maintReviewed?'View plan':'Review proposal'} ${icon('arrow',12)}</button></div>`}).join('')}</section>`}
function renderLibrary(){const list=library.filter(matchesLibrary);return pageHeader('Collection / Index','Library explorer','Петте категории на NAS библиотеката и преглед на идентификация, качество, версии и seeding.',`<div class="togglebar"><button class="${libraryMode==='grid'?'active':''}" data-action="lib-mode" data-value="grid">▦ Grid</button><button class="${libraryMode==='list'?'active':''}" data-action="lib-mode" data-value="list">☷ List</button></div><button class="btn secondary" data-action="library-scan">${icon('reload')} Simulate scan</button>`)+`<div class="chips" style="margin-bottom:16px">${tag('Movies','info')}${tag('Animations','info')}${tag('Documentaries','info')}${tag('Series','info')}${tag('Concerts','info')}${tag('Demo inventory (not CSV)','warn')}</div><div class="panel"><div class="filters"><input class="field search" id="librarySearch" placeholder="Search media / TMDb / category" value="${esc(librarySearch)}"><select class="select" id="libraryCategory"><option value="All">All categories</option>${['Movies','Animations','Documentaries','Series','Concerts'].map(c=>`<option value="${c}" ${libraryCategory===c?'selected':''}>${c}</option>`).join('')}</select><select class="select" id="libraryAudio"><option value="all">All audio</option><option value="verified" ${libraryAudio==='verified'?'selected':''}>Verified BG</option><option value="needs" ${libraryAudio==='needs'?'selected':''}>Not verified BG</option></select><select class="select" id="libraryQuality"><option value="all">All qualities</option><option value="2160p" ${libraryQuality==='2160p'?'selected':''}>2160p</option><option value="1080p" ${libraryQuality==='1080p'?'selected':''}>1080p</option></select><button class="btn small secondary" data-action="lib-clear">Clear</button></div><div class="panel-body" id="libraryResults"><div class="section-title" style="margin:0 0 15px"><h2>${list.length} titles</h2><p>Version grouping, metadata completeness, language and seed status</p></div>${list.length?libraryMode==='grid'?`<div class="library-grid">${list.map(m=>`<button class="library-card" data-action="lib-item" data-id="${m.id}"><div class="cover ${esc(m.poster)}"><strong>${esc(m.title)}</strong></div><div class="lower"><div class="name">${esc(m.title)} <span class="muted">(${m.year})</span></div><div class="meta">${esc(m.category)} · ${esc(m.quality)} · ${m.versions} ${m.versions===1?'version':'versions'}</div><div class="chips" style="margin-top:9px">${audioTag(m.audio)}${subtitleTag(m.sub)}</div><div class="chips" style="margin-top:6px">${seedTag(m.seed)}${tag(m.metadata,m.metadata==='Complete'?'success':m.metadata==='Unmatched'||m.metadata==='Wrong category'?'danger':'warn')}</div></div></button>`).join('')}</div>`:`<div class="library-list">${list.map(m=>`<button class="library-line" data-action="lib-item" data-id="${m.id}"><span style="display:flex;gap:12px;align-items:center"><span class="lib-mini"></span><span><strong>${esc(m.title)} (${m.year})</strong><br><span class="tiny">${esc(m.category)} · TMDb ${esc(m.tmdb)} · ${m.versions} version(s)</span></span></span><span class="chips">${tag(m.quality,'info')}${audioTag(m.audio)}${subtitleTag(m.sub)}${seedTag(m.seed)}${tag(m.metadata,'plain')}</span></button>`).join('')}</div>`:'<div class="empty">No titles found with the current filters.</div>'}</div></div>${renderLibraryMaintenance()}<div class="info-strip">${icon('info')} Maintenance mode will index existing media without changing it. Identification and duplicate proposals are staged for approval. No automatic deletion or renaming of the real NAS library is part of this prototype.</div>`}

function renderSubtitles(){const selected=jobById(currentId);const focus=subtitleJobs.includes(currentId)?currentId:'VM-1047';return pageHeader('Languages / Subtitle matching','Subtitle manager','Provider candidates, FPS, edition compatibility, timing и контролирана ръчна селекция.',`<button class="btn secondary" data-action="subtitle-search" data-id="${focus}">${icon('reload')} Retry search (demo)</button>`)+`<div class="panel"><div class="panel-head"><div><div class="ph-title">Bulgarian subtitle tasks</div><div class="ph-sub">Existing / embedded → provider → release matching → timing → confirmation</div></div>${tag('Matching safeguards enabled','success')}</div><div class="tabs">${subtitleJobs.map(id=>{const j=jobById(id);return `<button class="tab ${focus===id?'active':''}" data-action="subtitle-select-job" data-id="${id}">${esc(j.title.length>19?j.title.slice(0,18)+'…':j.title)} ${j.bgSub==='mismatch'?'⚠':''}</button>`}).join('')}</div>${renderSubtitleCandidates(jobById(focus))}</div>`}

condary" data-action="subtitle-preview" data-id="${j.id}" data-candidate="${c.id}">Inspect timing</button></div></div>`).join('')}</div><div class="hint">Provider names, matching scores and timings are illustrative. No subtitle provider is queried.</div></div>`}

if(settingsTab==='naming')return `<div class="card-title">Naming conventions & preview</div>${settingLabel('Filename template','Simulation only',settingField('naming',settings.naming))}<div class="info-card"><div class="card-title">Movie / multiple versions preview ${tag('Jellyfin compliant','success')}</div><div class="file-tree"><div class="tree-dir">Movies/The Matrix (1999) [tmdbid-603]/</div><div class="tree-file">├─ The Matrix (1999) [tmdbid-603] - 1080p BG.mkv</div><div class="tree-file">├─ The Matrix (1999) [tmdbid-603] - 2160p HDR10.mkv</div><div class="tree-file">├─ The Matrix (1999) [tmdbid-603] - 2160p HDR10.bg.srt</div><div class="tree-file">├─ movie.nfo</div><div class="tree-file">└─ poster.jpg</div></div><div class="rule-note">Both version filenames start with the exact parent folder base, including the provider ID.</div></div><div class="info-card" style="margin-top:13px"><div class="card-title">TV series / season pack preview</div><div class="file-tree"><div class="tree-dir">Series/The Last of Us (2023) [tmdbid-100088]/</div><div>├─ tvshow.nfo</div><div class="tree-dir">└─ Season 01/</div><div class="tree-file">   ├─ The Last of Us S01E01.mkv</div><div class="tree-file">   ├─ The Last of Us S01E01.bg.srt</div><div class="tree-file">   └─ The Last of Us S01E02.mkv</div></div></div><div class="info-strip warn">${icon('alert')} Filenames within a torrent may only be reorganized through safe qB file/folder rename operations, or published using a separate NAS layout. Release name stays in the audit database.</div>`;
if(settingsTab==='quality')return `<div class="card-title">Bulgarian-first with quality safeguards ${tag('Policy locked','success')}</div><div class="info-card"><div class="card-title">Retention policy</div><div class="stream-row"><span>Verified BG dubbing receives priority</span>${tag('Required','success')}</div><div class="stream-row"><span>Keep better non-BG edition where justified</span>${tag('Allowed','success')}</div><div class="stream-row"><span>Never replace BG version at comparable quality</span>${tag('Required','success')}</div><div class="stream-row"><span>Unknown audio never authorizes deletion</span>${tag('Required','success')}</div><div class="stream-row"><span>Different editions remain distinct</span>${tag('Required','success')}</div></div>${settingLabel('Quality safeguard','Relative quality, not just resolution',`<select class="select form-control" data-setting="threshold"><option value="substantial" ${settings.threshold==='substantial'?'selected':''}>Substantial quality gain</option><option value="high" ${settings.threshold==='high'?'selected':''}>Very high threshold</option></select>`)}${settingLabel('BG audio verification','Language tag alone is insufficient',`<select class="select form-control" data-setting="audioVerification"><option value="required" ${settings.audioVerification==='required'?'selected':''}>Requires confirmation before replacement</option><option value="manual" ${settings.audioVerification==='manual'?'selected':''}>Manual-only verification</option></select>`)}${settingLabel('Preferred subtitle languages','Comma-separated locale identifiers',settingField('subtitlePreferred',settings.subtitlePreferred))}${settingSwitch('retention','Preserve higher-quality second edition','Retains verified BG audio when comparable',true)}<div class="info-strip">${icon('shield')} Scores consider codec, bitrate, HDR/DV, audio channels, edition, duration, subtitle availability, size and torrent dependencies.</div>`;

if(j.step===4){if(j.move.pct<100){j.phase='copying';j.move.pct=Math.min(100,j.move.pct+8);j.progress=j.move.pct;if(j.scenario===5&&!j.nasRecovered&&j.move.pct>=46){j.move.pct=46;j.status='failed';j.seed='paused';j.phase='recovery';j.error='NAS mount lost at 46%; partial destination untrusted. Source and torrent state preserved.';addAudit(j,'NAS unavailable during cross-filesystem copy. Recovery checkpoint created.','failure');stopSim();notify('NAS disconnected. Copy stopped; source retained.','error');render();return}render();return}

j.step=5;j.phase='subtitles';addAudit(j,'Safe transfer checkpoint closed. qB seed confirmed; metadata & NFO staging simulated.');render();return}

function startSimulation(id){let j=jobById(id);if(!j)return;if(j.status==='completed'){notify('Already completed. Run a new scenario or reset demo.','warn');return}if(j.status==='failed'){openModal('recovery',{id});return}if(j.status==='review'){reviewJob(j);return}if(simTimer&&activeSimulationId===id){notify('Demo worker already running for this job.');return}if(simTimer&&activeSimulationId!==id){let old=jobById(activeSimulationId);if(old){old.status='paused';addAudit(old,'Demo worker paused to run another job.')}stopSim()}j.status='processing';j.phase=j.step===4?'copying':'processing';if(j.step===4)j.seed='moving';activeSimulationId=id;addAudit(j,'Worker started / resumed by operator (simulation).');render();simTimer=setInterval(()=>advanceJob(j),440);notify('Simulating workflow for '+j.title)}
function pauseJob(j){if(activeSimulationId===j.id)stopSim();j.status='paused';j.phase='paused';addAudit(j,'Job paused by operator. Files and source state preserved.');render();notify('Job paused: '+j.title)}

document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{const t=e.target;if(t.id==='jobSearch'){jobSearch=t.value;const tbody=document.getElementById('jobsBody');if(tbody){const matches=jobs.filter(matchesJob);tbody.innerHTML=matches.map(jobRow).join('')||'<tr><td colspan="13" class="empty">No matching jobs.</td></tr>';const c=document.getElementById('tableCount');if(c)c.textContent=`Showing ${matches.length} / ${jobs.length} jobs`;}return}if(t.id==='librarySearch'){librarySearch=t.value;const results=document.getElementById('libraryResults');if(results){const tmp=document.createElement('div');tmp.innerHTML=renderLibrary();results.innerHTML=tmp.querySelector('#libraryResults').innerHTML;}return}if(t.dataset.setting){settings[t.dataset.setting]=t.type==='number'?Number(t.value):t.value;return}if(t.id==='destRelative'||t.id==='destCategory'){const cat=document.getElementById('destCategory')?.value||'Movies';const rel=document.getElementById('destRelative')?.value||'';const p=document.getElementById('destPreview');if(p)p.textContent='/library/'+cat+'/'+rel;return}});
document.addEventListener('change',e=>{const t=e.target;if(['jobStatus','jobCategory','jobAudio','jobQuality','jobSource','jobDate'].includes(t.id)){const k={jobStatus:'jobStatus',jobCategory:'jobCategory',jobAudio:'jobAudio',jobQuality:'jobQuality',jobSource:'jobSource',jobDate:'jobDate'}[t.id];if(k==='jobStatus')jobStatus=t.value;if(k==='jobCategory')jobCategory=t.value;if(k==='jobAudio')jobAudio=t.value;if(k==='jobQuality')jobQuality=t.value;if(k==='jobSource')jobSource=t.value;if(k==='jobDate')jobDate=t.value;render();return}if(['libraryCategory','libraryAudio','libraryQuality'].includes(t.id)){if(t.id==='libraryCategory')libraryCategory=t.value;if(t.id==='libraryAudio')libraryAudio=t.value;if(t.id==='libraryQuality')libraryQuality=t.value;render();return}if(t.id==='compareSelect'){compareId=t.value;render();return}if(t.id==='librarySearch'){librarySearch=t.value;render();return}if(t.dataset.setting){settings[t.dataset.setting]=t.type==='number'?Number(t.value):t.value;return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Enter'&&e.target.id==='librarySearch'){librarySearch=e.target.value;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h.startsWith('job/')){const id=h.slice(4);if(jobById(id))setRoute('job',id)}else if(NAVS.some(n=>n[0]===h)){view=h;render()}});
const initialHash=location.hash.slice(1);if(initialHash.startsWith('job/')&&jobById(initialHash.slice(4))){view='job';currentId=initialHash.slice(4);activeStep=jobById(currentId).step}else if(NAVS.some(n=>n[0]===initialHash)){view=initialHash}render();
</script>
</body>
</html>
