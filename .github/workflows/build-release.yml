name: Build and publish RC1
on:
  push:
    branches: [codex/rc1]
    tags: ['v1.0.0-rc.1']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rc1-publication
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
  prepare:
    needs: [verify, security]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - name: Registry and source preconditions
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$HUB_USER" = vesovasilev || { echo 'BLOCKED: DOCKERHUB_USERNAME must name the authorized namespace'; exit 1; }
          test -n "$HUB_TOKEN" || { echo 'BLOCKED: DOCKERHUB_TOKEN is missing'; exit 1; }
          case "$GITHUB_REF" in refs/heads/codex/rc1|refs/tags/v1.0.0-rc.1) ;; *) echo 'Unapproved release ref'; exit 1;; esac
      - name: Create exact RC tag only after all gates pass
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-rc.1" > existing-tag.json 2> tag-error.txt; then
            test "$(jq -r .object.sha existing-tag.json)" = "$GITHUB_SHA" || { echo 'BLOCKED: RC tag already points to a different commit; refusing overwrite'; exit 1; }
          else
            grep -q '404' tag-error.txt || { echo 'BLOCKED: cannot verify existing tag'; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1.0.0-rc.1 -f sha="$GITHUB_SHA" > /dev/null
          fi
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: web, context: frontend}
          - {image: backend, context: backend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: v1.0.0-rc.1}
      - name: Publication preconditions
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$HUB_USER" = vesovasilev || { echo 'BLOCKED: DOCKERHUB_USERNAME must name the authorized namespace'; exit 1; }
          test -n "$HUB_TOKEN" || { echo 'BLOCKED: DOCKERHUB_TOKEN is missing'; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'RC tag/source mismatch'; exit 1; }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - name: Refuse to overwrite an existing RC tag
        run: |
          if docker buildx imagetools inspect vesovasilev/media-manager-${{ matrix.image }}:1.0.0-rc.1 >/dev/null 2>&1; then
            echo 'RC tag already exists; inspect its provenance before any retry. No overwrite.'
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: vesovasilev/media-manager-${{ matrix.image }}:1.0.0-rc.1
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.0.0-rc.1
            org.opencontainers.image.source=https://github.com/vesovasilev-vimag/media-manager
      - name: Record actual registry digest
        env: {DIGEST: '${{ steps.build.outputs.digest }}'}
        run: |
          mkdir -p release
          jq -n --arg image "vesovasilev/media-manager-${{ matrix.image }}@$DIGEST" '{image:$image}' > release/${{ matrix.image }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'image-${{ matrix.image }}', path: release}
  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: image-*, path: release, merge-multiple: true}
      - name: Immutable deployment artifact (no source build)
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg web "$(jq -r .image release/web.json)" --arg backend "$(jq -r .image release/backend.json)" '{version:"1.0.0-rc.1",commit:$commit,compatible_schemas:["0001"],platforms:["linux/amd64","linux/arm64"],images:{web:$web,backend:$backend,postgres:"postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b"}}' > release/release-manifest.json
          python3 deploy/scripts/validate-release.py release/release-manifest.json
          cp deploy/compose.prod.yaml deploy/env.example release/
          cp -r deploy/scripts release/
          cp docs/deployment-and-backup.md docs/operations-and-recovery.md docs/qbt-integration-runbook.md docs/storage-mount-matrix.md release/
          tar -czf rc1-deployment.tar.gz -C release .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: rc1-deployment, path: rc1-deployment.tar.gz}
