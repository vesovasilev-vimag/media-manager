name: Publish ViMag v1.1 release candidate (manual)
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: vimag-v1.1-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/rc1'
    uses: ./.github/workflows/ci.yml
  security:
    if: github.ref == 'refs/heads/codex/rc1'
    uses: ./.github/workflows/security.yml
  prepare:
    needs: [verify, security]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - name: Assert exact release source and credentials
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/codex/rc1
          test "$HUB_USER" = vesovasilev
          test -n "$HUB_TOKEN"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.0-rc.1" > existing-tag.json 2> tag-error.txt; then
            echo 'BLOCKED: release tag already exists; never overwrite immutable release'
            exit 1
          else
            grep -q '404' tag-error.txt || { echo 'BLOCKED: could not verify tag absence'; exit 1; }
          fi
      - name: Create immutable v1.1 release tag
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1.1.0-rc.1 -f sha="$GITHUB_SHA" > /dev/null
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: web, context: frontend}
          - {image: backend, context: backend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: v1.1.0-rc.1}
      - name: Validate immutable source and target tag
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if docker buildx imagetools inspect vesovasilev/media-manager-${{ matrix.image }}:1.1.0-rc.1 >/dev/null 2>&1; then
            echo 'BLOCKED: image tag already exists; never overwrite immutable release'
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: vesovasilev/media-manager-${{ matrix.image }}:1.1.0-rc.1
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.1.0-rc.1
            org.opencontainers.image.source=https://github.com/vesovasilev-vimag/media-manager
      - name: Record digest
        env: {DIGEST: '${{ steps.build.outputs.digest }}'}
        run: |
          mkdir -p release
          jq -n --arg image "vesovasilev/media-manager-${{ matrix.image }}@$DIGEST" '{image:$image}' > release/${{ matrix.image }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'v11-image-${{ matrix.image }}', path: release}
  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: v1.1.0-rc.1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: v11-image-*, path: release, merge-multiple: true}
      - name: Validate release and package immutable deploy inputs
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg web "$(jq -r .image release/web.json)" --arg backend "$(jq -r .image release/backend.json)" '{version:"1.1.0-rc.1",commit:$commit,compatible_schemas:["0002"],platforms:["linux/amd64","linux/arm64"],images:{web:$web,backend:$backend,postgres:"postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b"}}' > release/release-manifest.json
          python3 deploy/scripts/validate-v11-release.py release/release-manifest.json
          cp deploy/compose.prod.yaml deploy/env.example release/
          cp -r deploy/scripts release/
          cp docs/v1.1/operations-and-recovery.md docs/v1.1/implementation-report.md release/
          cp docs/deployment-and-backup.md release/
          tar -czf v11-deployment.tar.gz -C release .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v11-deployment, path: v11-deployment.tar.gz}
