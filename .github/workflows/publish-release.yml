name: Publish ViMag Release (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Owner-approved version, e.g. 0.2.0"
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: vimag-release
  cancel-in-progress: false
jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  security:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yml
  prepare:
    needs: [ci, security]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate version and immutable source
        env:
          VERSION: ${{ inputs.version }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          test "$HUB_USER" = vesovasilev
          test -n "$HUB_TOKEN"
          python3 deploy/scripts/validate-release.py --version "$VERSION"
      - name: Refuse to overwrite Git release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2> tag-error.txt; then
            echo 'BLOCKED: immutable Git tag already exists'
            exit 1
          fi
          grep -q '404' tag-error.txt || { echo 'Cannot establish tag absence'; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" > /dev/null
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: web, context: frontend}
          - {image: backend, context: backend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: v${{ inputs.version }}}
      - name: Confirm tag source and image tag absence
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if docker manifest inspect "vesovasilev/media-manager-$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo 'BLOCKED: immutable Docker tag exists'
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: vesovasilev/media-manager-${{ matrix.image }}:${{ inputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          mkdir -p release
          jq -n --arg image "vesovasilev/media-manager-$IMAGE@$DIGEST" '{image:$image}' > "release/$IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-image-${{ matrix.image }}
          path: release/
  manifest:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: v${{ inputs.version }}}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: release-image-*, path: release, merge-multiple: true}
      - name: Validate and package immutable deployment manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg web "$(jq -r .image release/web.json)" --arg backend "$(jq -r .image release/backend.json)" '{version:$version,commit:$commit,compatible_schemas:["0002"],platforms:["linux/amd64","linux/arm64"],images:{web:$web,backend:$backend,postgres:"postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b"}}' > release/release-manifest.json
          python3 deploy/scripts/validate-release.py --version "$VERSION" --commit "$GITHUB_SHA" --manifest release/release-manifest.json
          cp deploy/compose.prod.yaml deploy/env.example docs/release-history.md release/
          cp -r deploy/scripts release/
          tar -czf "vimag-$VERSION-deployment.tar.gz" -C release .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-deployment-${{ inputs.version }}
          path: vimag-*-deployment.tar.gz
