name: vimag-v11-compat
services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7@sha256:7ae36aab93ef9b6aaff02b37f8bb23df84bb2d7a3f6054ec8fc466072a648ce2
    volumes: [fixtures:/fixtures:ro, config:/config, cache:/cache]
    networks: [compat]
    environment: {JELLYFIN_PublishedServerUrl: http://jellyfin:8096}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8096/health]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
networks:
  compat: {internal: true}
volumes:
  fixtures: {name: vimag-v11-jellyfin-fixtures}
  config:
  cache:
