name: vimag-roles-test
services:
  db:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: vimag_cluster_admin
      POSTGRES_DB: vimag
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ../deploy/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-vimag.sql:ro
    secrets: [db_password, db_admin_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vimag -d vimag"]
      interval: 1s
      timeout: 3s
      retries: 30
secrets:
  db_password: {file: ../deploy/secrets/db_password}
  db_admin_password: {file: ../deploy/secrets/setup_token}
