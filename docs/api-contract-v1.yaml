components:
  schemas:
    Approval:
      properties:
        plan_revision:
          type: integer
          minimum: 1.0
          title: Plan Revision
        plan_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Plan Sha256
        confirmed:
          type: boolean
          title: Confirmed
      additionalProperties: false
      type: object
      required:
      - plan_revision
      - plan_sha256
      - confirmed
      title: Approval
    AssetEvidence:
      properties:
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        stream_key:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Stream Key
        action:
          type: string
          enum:
          - verify
          - revoke
          title: Action
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - fingerprint
      - stream_key
      - action
      - reason
      title: AssetEvidence
    Credentials:
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: Credentials
    Evidence:
      properties:
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        stream_key:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Stream Key
        action:
          type: string
          enum:
          - verify
          - revoke
          title: Action
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        item_id:
          type: string
          format: uuid
          title: Item Id
      additionalProperties: false
      type: object
      required:
      - fingerprint
      - stream_key
      - action
      - reason
      - item_id
      title: Evidence
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IdentityInput:
      properties:
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
        identity:
          additionalProperties: true
          type: object
          title: Identity
        category:
          anyOf:
          - type: string
            enum:
            - movies
            - series
            - animations
            - documentaries
            - concerts
          - type: 'null'
          title: Category
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - identity
      title: IdentityInput
    IdentityLookup:
      properties:
        provider_id:
          type: string
          pattern: ^[0-9]{1,12}$
          title: Provider Id
        media_type:
          type: string
          enum:
          - movie
          - show
          - concert
          title: Media Type
      additionalProperties: false
      type: object
      required:
      - provider_id
      - media_type
      title: IdentityLookup
    IdentitySearch:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        media_type:
          type: string
          enum:
          - movie
          - show
          - concert
          title: Media Type
        year:
          anyOf:
          - type: integer
            maximum: 2200.0
            minimum: 1880.0
          - type: 'null'
          title: Year
      additionalProperties: false
      type: object
      required:
      - title
      - media_type
      title: IdentitySearch
    NormalizeReview:
      properties:
        identity:
          additionalProperties: true
          type: object
          title: Identity
        quality_label:
          type: string
          maxLength: 80
          minLength: 1
          title: Quality Label
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - identity
      - quality_label
      - reason
      title: NormalizeReview
    PlanAction:
      properties:
        plan_revision:
          type: integer
          minimum: 1.0
          title: Plan Revision
        plan_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Sha256
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - plan_revision
      - plan_sha256
      - reason
      title: PlanAction
    PolicyInput:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        policy:
          additionalProperties: true
          type: object
          title: Policy
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - policy
      title: PolicyInput
    PolicyPreview:
      properties:
        policy:
          additionalProperties: true
          type: object
          title: Policy
        category:
          type: string
          title: Category
        identity:
          additionalProperties: true
          type: object
          title: Identity
        data:
          additionalProperties: true
          type: object
          title: Data
        path:
          type: string
          title: Path
          default: preview.mkv
      additionalProperties: false
      type: object
      required:
      - policy
      - category
      - identity
      title: PolicyPreview
    RestoreScope:
      properties:
        manifest_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10000
          minItems: 1
          title: Manifest Ids
        confirmed:
          type: boolean
          title: Confirmed
      additionalProperties: false
      type: object
      required:
      - manifest_ids
      - confirmed
      title: RestoreScope
    Review:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        item_id:
          type: string
          format: uuid
          title: Item Id
        material_improvement_verified:
          type: boolean
          title: Material Improvement Verified
          default: false
        identity:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Identity
        quality_decision:
          anyOf:
          - type: string
            enum:
            - KeepBoth
            - KeepBGPreferred
            - PreferBetterBG
            - NeedsReview
            - Skip
          - type: 'null'
          title: Quality Decision
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - item_id
      - reason
      title: Review
    Scope:
      properties:
        asset_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10000
          title: Asset Ids
        category:
          anyOf:
          - type: string
            enum:
            - movies
            - series
            - animations
            - documentaries
            - concerts
          - type: 'null'
          title: Category
        all:
          type: boolean
          title: All
          default: false
      additionalProperties: false
      type: object
      title: Scope
    Setup:
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
        setup_token:
          type: string
          format: password
          title: Setup Token
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - username
      - password
      - setup_token
      title: Setup
    SidecarApproval:
      properties:
        plan_revision:
          type: integer
          minimum: 1.0
          title: Plan Revision
        plan_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Sha256
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        relative_path:
          type: string
          maxLength: 900
          minLength: 1
          title: Relative Path
        observed_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Observed Sha256
      additionalProperties: false
      type: object
      required:
      - plan_revision
      - plan_sha256
      - reason
      - relative_path
      - observed_sha256
      title: SidecarApproval
    SubtitleAccept:
      properties:
        asset_revision:
          type: integer
          minimum: 1.0
          title: Asset Revision
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
        content:
          type: string
          maxLength: 1048576
          minLength: 1
          title: Content
        edition:
          type: string
          title: Edition
        fps:
          anyOf:
          - type: number
            maximum: 240.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Fps
        duration:
          type: number
          exclusiveMinimum: 0.0
          title: Duration
        language:
          type: string
          const: bg
          title: Language
          default: bg
        kind:
          type: string
          enum:
          - normal
          - forced
          - sdh
          title: Kind
          default: normal
        complete:
          type: boolean
          title: Complete
        timing_confirmed:
          type: boolean
          title: Timing Confirmed
        source_quality:
          type: string
          enum:
          - reviewed
          - unknown
          title: Source Quality
        provider:
          type: string
          maxLength: 80
          minLength: 1
          title: Provider
        release:
          type: string
          maxLength: 200
          minLength: 1
          title: Release
      additionalProperties: false
      type: object
      required:
      - asset_revision
      - fingerprint
      - content
      - edition
      - duration
      - complete
      - timing_confirmed
      - source_quality
