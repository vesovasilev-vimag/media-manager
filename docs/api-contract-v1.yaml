components:
  schemas:
    AssetEvidence:
      properties:
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        stream_key:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Stream Key
        action:
          type: string
          enum:
          - verify
          - revoke
          title: Action
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - fingerprint
      - stream_key
      - action
      - reason
      title: AssetEvidence
    Credentials:
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: Credentials
    Evidence:
      properties:
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        stream_key:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Stream Key
        action:
          type: string
          enum:
          - verify
          - revoke
          title: Action
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        item_id:
          type: string
          format: uuid
          title: Item Id
      additionalProperties: false
      type: object
      required:
      - fingerprint
      - stream_key
      - action
      - reason
      - item_id
      title: Evidence
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NormalizeReview:
      properties:
        identity:
          additionalProperties: true
          type: object
          title: Identity
        quality_label:
          type: string
          maxLength: 80
          minLength: 1
          title: Quality Label
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - identity
      - quality_label
      - reason
      title: NormalizeReview
    PlanAction:
      properties:
        plan_revision:
          type: integer
          minimum: 1.0
          title: Plan Revision
        plan_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Sha256
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - plan_revision
      - plan_sha256
      - reason
      title: PlanAction
    Review:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        item_id:
          type: string
          format: uuid
          title: Item Id
        identity:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Identity
        quality_decision:
          anyOf:
          - type: string
            enum:
            - KeepBoth
            - KeepBGPreferred
            - PreferBetterBG
            - NeedsReview
            - Skip
          - type: 'null'
          title: Quality Decision
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - item_id
      - reason
      title: Review
    Setup:
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
        setup_token:
          type: string
          format: password
          title: Setup Token
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - username
      - password
      - setup_token
      title: Setup
    SidecarApproval:
      properties:
        plan_revision:
          type: integer
          minimum: 1.0
          title: Plan Revision
        plan_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Sha256
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        relative_path:
          type: string
          maxLength: 900
          minLength: 1
          title: Relative Path
        observed_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Observed Sha256
      additionalProperties: false
      type: object
      required:
      - plan_revision
      - plan_sha256
      - reason
      - relative_path
      - observed_sha256
      title: SidecarApproval
    SubtitleReview:
      properties:
        item_id:
          type: string
          format: uuid
          title: Item Id
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Fingerprint
        edition:
          type: string
          maxLength: 120
          minLength: 1
          title: Edition
        content:
          type: string
          maxLength: 1048576
          minLength: 1
          title: Content
        timing_confirmed:
          type: boolean
          title: Timing Confirmed
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - item_id
      - fingerprint
      - edition
      - content
      - timing_confirmed
      - reason
      title: SubtitleReview
    SubtitleSync:
      properties:
        content:
          type: string
          maxLength: 1048576
          minLength: 1
          title: Content
        offset:
          type: number
          maximum: 300.0
          minimum: -300.0
          title: Offset
        scale:
          type: number
          maximum: 1.1
          minimum: 0.9
          title: Scale
      additionalProperties: false
      type: object
      required:
      - content
      - offset
      - scale
      title: SubtitleSync
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vimag_session
